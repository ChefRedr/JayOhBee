[project]
name = "jobbot"
version = "0.1.0"
description = "Personal automated new-grad SWE job hunter and auto-apply bot"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "playwright>=1.45",
    "gspread>=6.0",
    "google-auth>=2.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
jobbot = "jobbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
