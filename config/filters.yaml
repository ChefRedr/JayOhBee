# Deterministic eligibility rules. All matching is case-insensitive.

# A job title must match at least one positive term (always accepted),
# OR one adjacent term combined with an entry-level marker in the title
# or description.
positive_title_terms:
  - software engineer
  - software developer
  - software engineer i
  - software engineer 1
  - software engineer ii
  - new grad
  - new graduate
  - university graduate
  - college graduate
  - early career
  - entry level
  - entry-level
  - associate software engineer
  - graduate software engineer
  - full stack engineer
  - full-stack engineer
  - fullstack engineer
  - frontend engineer
  - front-end engineer
  - front end engineer

adjacent_title_terms:
  - backend engineer
  - back-end engineer
  - platform engineer
  - infrastructure engineer
  - systems engineer
  - site reliability engineer
  - machine learning engineer

# Adjacent titles are only accepted when one of these appears in the
# title or description.
entry_level_markers:
  - new grad
  - new graduate
  - university grad
  - college grad
  - early career
  - entry level
  - entry-level
  - "engineer i"
  - "engineer 1"
  - associate
  - graduate
  - junior
  - "0-1 years"
  - "0-2 years"
  - "0 to 1 year"
  - "0 to 2 years"

# A title containing any of these is always rejected.
negative_title_terms:
  # non-software engineering disciplines and non-SWE "engineer" roles
  - civil
  - structural
  - mechanical
  - electrical
  - hardware
  - manufacturing
  - industrial engineer
  - propulsion
  - avionics
  - thermal
  - materials engineer
  - facilities
  - geotechnical
  - chemical engineer
  - biomedical
  - optical
  - mechatronics
  - technical support
  - support engineer
  - solutions engineer
  - sales engineer
  - field engineer
  - network engineer
  - help desk
  - desktop support
  - quality engineer
  - process engineer
  - it support
  # seniority
  - senior
  - sr.
  - "sr "
  - staff
  - principal
  - lead
  - manager
  - director
  - architect
  - distinguished
  - head of
  - vp
  - vice president
  - fellow
  - iii
  - " iv"
  - " v,"

# Looking for full-time roles, so drop internships/co-ops.
reject_internships: true

# Reject postings whose description requires more than this many years
# of experience (e.g. "3+ years", "5 years of experience").
max_years_experience: 2

# Title keywords matching the applicant's resume, used to rank which role to
# apply to FIRST at each company (some companies limit applications). Ordering
# only — never affects eligibility.
rank_boost_terms:
  - full stack
  - full-stack
  - fullstack
  - frontend
  - front-end
  - front end
  - backend
  - back-end
  - back end
  - web
  - mobile
  - ios
  - android
  - machine learning
  - ai
  - cloud
  - platform
  - distributed
  - data

# Optional location gating (whole-word matching). Empty allow-list means every
# location passes unless denied. Deny-first: US-only via a foreign-marker deny
# list, so ambiguous strings ("2 Locations", "Hybrid", city-only) still pass.
